version: 2

# Try using these source definitions instead!
sources:
  - name: ecom
    schema: "{{ target.schema }}_raw"
    description: E-commerce data for the Jaffle Shop
    tables:
      - name: raw_customers
        description: One record per person who has purchased one or more items
      - name: raw_orders
        description: One record per order (consisting of one or more order items)
        config:
          loaded_at_field: ordered_at
      - name: raw_items
        description: Items included in an order
      - name: raw_stores
        config:
          loaded_at_field: opened_at
      - name: raw_products
        description: One record per SKU for items sold in stores
      - name: raw_supplies
        description: One record per supply per SKU of items sold in stores

  - name: vc_deal_flow
    description: "VC Deal Flow Intelligence source data stored in Snowflake."
    database: VC_DEAL_FLOW_DB
    schema: ANALYTICS

    tables:
      - name: STARTUP_PROFILES
        description: "Cleaned startup profiles containing company information, industries, geography and business characteristics."

      - name: INVESTOR_PROFILES
        description: "Investor profiles containing investment history, sectors, geography and historical stage preferences."

      - name: INVESTOR_MATCHES
        description: "Explainable startup-investor matching results containing compatibility scores and evidence coverage."